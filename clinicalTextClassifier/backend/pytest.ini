[pytest]
# Pytest configuration for Agent 1 tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Path configuration
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    asyncio: mark test as async
    integration: mark test as integration test (requires GEMINI_API_KEY)
