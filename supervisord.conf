[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:agent1_clarifier]
directory=/app/clinicalTextClassifier/backend
command=uvicorn app.main:app --host 127.0.0.1 --port 8000
autostart=true
autorestart=true
stderr_logfile=/tmp/agent1.err.log
stdout_logfile=/tmp/agent1.out.log

[program:agent2_retrieval]
directory=/app/vectorRetrieval
command=uvicorn app:app --host 127.0.0.1 --port 8002
autostart=true
autorestart=true
stderr_logfile=/tmp/agent2.err.log
stdout_logfile=/tmp/agent2.out.log

[program:agent3_scanner]
directory=/app/evidenceScanner
command=uvicorn app:app --host 127.0.0.1 --port 8003
autostart=true
autorestart=true
stderr_logfile=/tmp/agent3.err.log
stdout_logfile=/tmp/agent3.out.log

[program:agent4_fusion]
directory=/app/dataFusion
command=uvicorn app.main:app --host 127.0.0.1 --port 8004
autostart=true
autorestart=true
stderr_logfile=/tmp/agent4.err.log
stdout_logfile=/tmp/agent4.out.log

[program:agent5_reasoning]
directory=/app/clinicalReasoning
command=uvicorn app.main:app --host 127.0.0.1 --port 8005
autostart=true
autorestart=true
stderr_logfile=/tmp/agent5.err.log
stdout_logfile=/tmp/agent5.out.log

[program:orchestrator]
directory=/app/orchestrator
command=uvicorn app:app --host 0.0.0.0 --port 7860
autostart=true
autorestart=true
stderr_logfile=/tmp/orchestrator.err.log
stdout_logfile=/tmp/orchestrator.out.log
